[package]
name = "poasta"
version = "0.2.0-alpha.1"
authors = ["Lucas van Dijk"]
description = "Fast genome-scale partial order aligner"
documentation = "https://github.com/broadinstitute/poasta"
edition = "2021"

[dependencies]
flate2 = "1.0.34"
num = { version = "~0.4" }
petgraph = { version = "~0.8", features = ["serde-1"] }
tracing = { version = "0.1.40" }
noodles = { version = "~0.99", features = ["fasta", "fastq"] }
itertools = "0.14.0"
rustc-hash = "2.1.1"

# CLI
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }
clap = { version = "4.5.19", features = ["derive"], optional = true }

# Testing
spoa_rs = { git = "https://github.com/broadinstitute/spoa-rs", version = "0.1.0", optional = true }

[features]
default = ["cli"]
cli = ["dep:tracing-subscriber", "dep:clap"]
# Compile out all tracing events at info level and below (keeps warn/error only).
# Use for maximum-performance benchmark/release builds.
disable_tracing = ["tracing/max_level_warn", "tracing/release_max_level_warn"]
test = ["dep:spoa_rs"]

[profile.release]
debug = true

[[bin]]
name = "poasta"
path = "src/bin/poasta.rs"
required-features = ["cli"]

[[bin]]
name = "poasta_vs_spoa"
path = "src/bin/poasta_vs_spoa.rs"
required-features = ["test"]

