[package]
name = "poasta"
version = "0.2.0-alpha.1"
authors = ["Lucas van Dijk"]
description = "Fast genome-scale partial order aligner"
license = "BSD-3-Clause"
repository = "https://github.com/broadinstitute/poasta"
documentation = "https://github.com/broadinstitute/poasta"
edition = "2024"

[dependencies]
flate2 = "1.1.9"

tracing = { version = "0.1.44" }
noodles = { version = "~0.109", features = ["fasta", "fastq"] }
itertools = "0.14.0"
rustc-hash = "2.1.2"

# CLI
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }

# Testing
spoa_rs = { git = "https://github.com/broadinstitute/spoa-rs", version = "0.1.0", optional = true }

[dev-dependencies]
# The mock graphs in `graph/mock.rs`.
petgraph = "~0.8"

[features]
default = ["cli"]
cli = ["dep:tracing-subscriber", "dep:clap", "dep:crossbeam-channel"]
# Compile out all tracing events at info level and below (keeps warn/error only).
# Use for maximum-performance benchmark/release builds.
disable_tracing = ["tracing/max_level_warn", "tracing/release_max_level_warn"]
bench = ["cli", "dep:spoa_rs"]
# Inspection API on the chain heuristic, for tools that show the search (poasta-viz).
viz = []

[profile.release]
debug = true
lto = 'thin'

[[bin]]
name = "poasta"
path = "src/bin/poasta.rs"
required-features = ["cli"]

[[bin]]
name = "lasagna"
path = "src/bin/lasagna.rs"
required-features = ["cli"]

[[bin]]
name = "poasta_vs_spoa"
path = "src/bin/poasta_vs_spoa.rs"
required-features = ["bench"]

