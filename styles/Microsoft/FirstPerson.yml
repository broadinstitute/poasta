extends: existence
message: "Use first person (such as '%s') sparingly."
link: https://learn.microsoft.com/en-us/style-guide/grammar/person
ignorecase: true
level: warning
# The 'I' token uses lookaround rather than consuming the leading space.
# Matching ' I' made the alert span one character too wide, which shows up as a
# misplaced underline in editors, and read as "such as ' I'". Dropping `nonword`
# also lets a project Vocab apply, which it can't when set. See PR #72.
tokens:
  - '(?<=^|\s)I(?=[\s,])'
  - "\\bI'd\\b"
  - "\\bI'll\\b"
  - "\\bI'm\\b"
  - "\\bI've\\b"
  - \bme\b
  - \bmy\b
  - \bmine\b
