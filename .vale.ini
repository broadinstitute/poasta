StylesPath = styles
Vocab = Poasta
MinAlertLevel = suggestion

Packages = Microsoft, proselint, ai-tells, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells-commits.zip

# Only spelling and AI-tell checks are on. Microsoft and proselint are
# installed for ad-hoc use but produce mostly noise on code comments.
[*.{md,rs}]
BasedOnStyles = Vale, ai-tells

# Casing enforcement of vocabulary entries: not wanted.
Vale.Terms = NO

# `--flag` and `..` ranges.
ai-tells.DoubleHyphen = NO

# Rules that flag literal technical usage: "implements a trait", "reaches
# the end node", "holds a score", "dynamic programming", three-item lists,
# code after a colon, and the metaphor family.
ai-tells.FormalRegister = NO
ai-tells.BareReaches = NO
ai-tells.BareHolds = NO
ai-tells.VerbTricolon = NO
ai-tells.ColonUsage = NO
ai-tells.OverusedVocabulary = NO
ai-tells.ShipOveruse = NO
ai-tells.CataphoricForecasting = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.ContrastiveNegation = NO
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO
ai-tells.AnthropomorphicCognition = NO
ai-tells.SummativeAppositive = NO
ai-tells.ConsequenceParticiple = NO
ai-tells.DefensiveHedges = NO
ai-tells.SelfReference = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeShape = NO
ai-tells.FigurativeIdioms = NO
ai-tells.FigurativeOwns = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeQuantities = NO
ai-tells.FigurativePays = NO
ai-tells.FigurativeNouns = NO
ai-tells.FigurativeLands = NO
ai-tells.MotionMetaphors = NO
ai-tells.FusionMetaphors = NO
